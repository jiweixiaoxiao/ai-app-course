    .result-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:14px;margin-bottom:14px}.chart{width:100%;height:330px}.chart.tall{height:390px}.chart-error{height:100%;display:grid;place-items:center;color:var(--orange);text-align:center;padding:20px;border:1px dashed rgba(255,180,84,.4);border-radius:14px}

    .curve-control{display:flex;align-items:center;gap:14px;margin:4px 0 8px}.curve-control span{color:var(--muted);white-space:nowrap}.curve-control input{flex:1}.curve-control strong{width:74px;text-align:right;color:var(--cyan)}
    details.checklist{border:1px solid var(--line);border-radius:16px;background:rgba(13,31,54,.86);padding:14px 16px;margin-top:14px}details.checklist summary{font-weight:800;cursor:pointer;color:#fff}
    .check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:13px}.check-item{padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.03)}.check-item b{display:block;margin-bottom:5px}.check-item .status{color:var(--yellow);font-size:12px}.check-item p{margin:5px 0 0;color:var(--muted);font-size:12.5px}

</head>

const rootObject = typeof window !== 'undefined' ? window : globalThis;

function clone(value){
  return JSON.parse(JSON.stringify(value));
}
function num(value){
  if(value === '' || value === null || value === undefined) return 0;
  const n = typeof value === 'number' ? value : parseFloat(value);
  return Number.isFinite(n) ? n : 0;
}
function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fixed(value, digits=2){
  return num(value).toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits});
}
function wan(valueYuan, digits=2){
  return fixed(num(valueYuan)/10000, digits);
}
function signedWan(valueYuan, digits=2){
  const v = num(valueYuan)/10000;
  return (v > 0 ? '+' : '') + fixed(v, digits);
}
function pct(valueDecimal, digits=2){
  return fixed(num(valueDecimal)*100, digits) + '%';
}
function formatByFmt(value, fmt){
  if(fmt === 'yuan0') return '¥' + fixed(value, 0);
  if(fmt === 'yuan2') return '¥' + fixed(value, 2);
  if(fmt === 'wan2') return wan(value, 2);
  if(fmt === 'num0') return fixed(value, 0);
  if(fmt === 'num2') return fixed(value, 2);
  if(fmt === 'pct2') return pct(value, 2);
  return value ?? '';
}

function calculateModel(inputState, overrides){
  const source = inputState || DEFAULT_STATE;
  const s = clone(source);
  if(overrides && overrides.params){
    s.params = Object.assign({}, s.params, overrides.params);
  }
  const p = s.params || {};
  const P = key => num(p[key]);
  const billingMonths = P('billingMonths');
  const payrollMonths = P('payrollMonths');

  // 收入：住宅、商业共用物业费综合收缴率；车位单独使用车位收缴率。
  const residentialSaturated = P('residentialArea') * P('residentialPrice') * billingMonths;
  const commercialSaturated = P('commercialArea') * P('commercialPrice') * billingMonths;
  const parkingSaturated = P('parkingSpaces') * P('parkingPrice') * billingMonths;
  const residentialIncome = residentialSaturated * P('propertyCollectionRate');
  const commercialIncome = commercialSaturated * P('propertyCollectionRate');
  const parkingIncome = parkingSaturated * P('parkingCollectionRate');
  const multiIncome = P('multiIncome');
  const subsidyIncome = P('subsidyIncome');
  const revenue = residentialIncome + commercialIncome + parkingIncome + multiIncome + subsidyIncome;

  // 人员成本
  const staffRows = (s.staff || []).map(r => {
    const headcount = num(r.headcount);
    const monthlyCostPerPerson = num(r.baseSalary) + num(r.postSalary) + num(r.socialInsurance) +
      num(r.housingFund) + num(r.welfare);
    const annualCostPerPerson = monthlyCostPerPerson * payrollMonths + num(r.yearEndBonus);
    return Object.assign({}, r, {
      headcount,
      monthlyCostPerPerson,
      annualCostPerPerson,
      annualRowCost: headcount * annualCostPerPerson
    });
  });
  const staffCount = staffRows.reduce((sum,r) => sum + r.headcount, 0);
  const staffCost = staffRows.reduce((sum,r) => sum + r.annualRowCost, 0);

  // 运营费用：同一 opsRows 集合只汇总一次；甲方责任计入 0。
  const opsRows = (s.ops || []).map(r => {
    const quantity = num(r.quantity);
    const unitPrice = num(r.unitPrice);
    const nominalAnnual = quantity * unitPrice;
    const includedAnnual = r.party === '甲方' ? 0 : nominalAnnual;
    return Object.assign({}, r, {quantity, unitPrice, nominalAnnual, includedAnnual});
  });
  const opsCost = opsRows.reduce((sum,r) => sum + r.includedAnnual, 0);
  const maintenanceCost = opsRows.filter(r => r.group === 'maintenance').reduce((sum,r) => sum + r.includedAnnual, 0);
  const dailyOpsCost = opsRows.filter(r => r.group === 'daily').reduce((sum,r) => sum + r.includedAnnual, 0);

  // 公共能耗
  const energyRows = (s.energy || []).map(r => {
    const annualKwh = num(r.quantity) * num(r.powerKw) * num(r.dailyHours) * num(r.annualDays) * num(r.loadFactor);
    const annualCost = annualKwh * num(r.electricityPrice);
    return Object.assign({}, r, {annualKwh, annualCost});
  });
  const energyCost = energyRows.reduce((sum,r) => sum + r.annualCost, 0);

  // 物资折旧
  const assetRows = (s.assets || []).map(r => {
    const originalValue = num(r.quantity) * num(r.unitPrice);
    const depreciationYears = num(r.depreciationYears);
    const annualDepreciation = depreciationYears > 0 ? (originalValue - num(r.salvageValue)) / depreciationYears : 0;
    return Object.assign({}, r, {originalValue, annualDepreciation});
  });
  const depreciationCost = assetRows.reduce((sum,r) => sum + r.annualDepreciation, 0);

  // 汇总：不可预见费不含管理酬金和税费；保本固定成本不含随收入变化的综合税费。
  const managementFee = P('managementFee');
  const contingencyCost = (staffCost + opsCost + energyCost + depreciationCost) * P('contingencyRate');
  const taxCost = revenue * P('taxRate');
  const totalCost = staffCost + opsCost + energyCost + depreciationCost + managementFee + contingencyCost + taxCost;
  const netProfit = revenue - totalCost;
  const netMargin = revenue > 0 ? netProfit / revenue : 0;
  const fixedCost = staffCost + opsCost + energyCost + depreciationCost + managementFee + contingencyCost;

  const taxDenominator = 1 - P('taxRate');
  const targetDenominator = taxDenominator - P('targetNetMargin');
  const safeDivide = (x, d) => Number.isFinite(d) && d > 0 ? x / d : 0;
  const collectedPropertyIncome = residentialIncome + commercialIncome;
  const collectedOperatingIncome = collectedPropertyIncome + parkingIncome;

  // 多经路径：锁定收缴率，反解多经总额。
  const beMultiTotal = Math.max(0,
    safeDivide(fixedCost, taxDenominator) - collectedOperatingIncome - subsidyIncome
  );
  const beMultiNew = Math.max(0, beMultiTotal - multiIncome);
  const targetMultiTotal = Math.max(0,
    safeDivide(fixedCost, targetDenominator) - collectedOperatingIncome - subsidyIncome
  );

  // 物业收缴率路径：锁定车位收入、现有多经和补贴，只反解住宅商业综合收缴率。
  const saturatedPropertyIncome = residentialSaturated + commercialSaturated;
  const bePropertyRate = saturatedPropertyIncome > 0 ? Math.max(0,
    (safeDivide(fixedCost, taxDenominator) - parkingIncome - multiIncome - subsidyIncome) / saturatedPropertyIncome
  ) : 0;
  const targetPropertyRate = saturatedPropertyIncome > 0 ? Math.max(0,
    (safeDivide(fixedCost, targetDenominator) - parkingIncome - multiIncome - subsidyIncome) / saturatedPropertyIncome
  ) : 0;

  const totalArea = P('residentialArea') + P('commercialArea');
  const weightedPrice = totalArea > 0
    ? (P('residentialArea') * P('residentialPrice') + P('commercialArea') * P('commercialPrice')) / totalArea
    : 0;

  return {
    params: p,
    totalArea,
    totalAreaWan: totalArea / 10000,
    weightedPrice,
    residentialSaturated, commercialSaturated, parkingSaturated,
    residentialIncome, commercialIncome, parkingIncome, multiIncome, subsidyIncome, revenue,
    staffRows, staffCount, staffCost,
    opsRows, opsCost, maintenanceCost, dailyOpsCost,
    energyRows, energyCost,
    assetRows, depreciationCost,
    managementFee, contingencyCost, taxCost, totalCost, netProfit, netMargin, fixedCost,
    beMultiTotal, beMultiNew, targetMultiTotal, bePropertyRate, targetPropertyRate
  };
}

function createEmptyState(){
  const s = clone(DEFAULT_STATE);
  ['residentialArea','commercialArea','residentialPrice','commercialPrice','billingMonths',
   'propertyCollectionRate','parkingSpaces','parkingPrice','parkingCollectionRate','multiIncome',
   'subsidyIncome','managementFee','contingencyRate','taxRate','targetNetMargin','payrollMonths'
  ].forEach(k => { s.params[k] = ''; });
  s.staff.forEach(r => {
    ['headcount','baseSalary','postSalary','socialInsurance','housingFund','welfare','yearEndBonus']
      .forEach(k => { r[k] = ''; });
  });
  s.ops.forEach(r => { r.quantity = ''; r.unitPrice = ''; });
  s.energy.forEach(r => {
    ['quantity','powerKw','dailyHours','annualDays','loadFactor','electricityPrice'].forEach(k => { r[k] = ''; });
  });
  s.assets.forEach(r => {
    ['quantity','unitPrice','salvageValue','depreciationYears'].forEach(k => { r[k] = ''; });
  });
  return s;
}

function field(o){

  let val = raw == null ? '' : raw;
  if(raw !== '' && raw != null){
    if(o.bindType === 'percent') val = num(raw) * 100;
    if(o.bindType === 'wanYuan') val = num(raw) / 10000;

  const inputType = o.type || 'number';
  return `<label class="field ${o.wide ? 'wide' : ''}">
    <span>${esc(o.label)}</span>
    <div class="input-wrap">
      <input type="${inputType}" step="${o.step ?? 'any'}" ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''}
        data-bind="${esc(o.path)}" ${o.bindType ? `data-bind-type="${o.bindType}"` : ''}
        value="${esc(val)}" placeholder="${esc(o.placeholder || '')}">
      ${o.unit ? `<em>${esc(o.unit)}</em>` : ''}
    </div>
    ${o.hint ? `<small>${esc(o.hint)}</small>` : ''}
  </label>`;
}

function $(selector){ return document.querySelector(selector); }
function $$(selector){ return Array.from(document.querySelectorAll(selector)); }

function getPath(obj, path){
  return path.split('.').reduce((acc,key) => acc == null ? acc : acc[key], obj);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let cursor = obj;
  for(let i=0;i<parts.length-1;i++){
    const key = parts[i];
    cursor = cursor[key];
  }
  cursor[parts[parts.length-1]] = value;
}

  stepper.innerHTML = STEP_META.map((s,i) => `
    <button type="button" class="step ${i===currentStep?'active':''} ${i<currentStep?'done':''}" data-step="${i}" aria-current="${i===currentStep?'step':'false'}">
      <span class="step-num">${i<currentStep ? '✓' : i+1}</span>
      <span class="step-text"><b>${s.title}</b><small>${s.hint}</small></span>
    </button>`).join('');
  const activeBtn = stepper.querySelector('.step.active');
  if(activeBtn && stepper.scrollWidth > stepper.clientWidth){
    const sr = stepper.getBoundingClientRect();
    const ar = activeBtn.getBoundingClientRect();
    if(ar.left < sr.left + 24 || ar.right > sr.right - 24){
      stepper.scrollLeft += (ar.left - sr.left) - (sr.width - ar.width) / 2;
    }
  }
}
function updateNav(){
  if(prevBtn) prevBtn.disabled = currentStep === 0;
  if(nextBtn) nextBtn.textContent = currentStep === 6 ? '回到第 1 步' : '下一步';
  if(stepHint) stepHint.textContent = `第 ${currentStep+1} / 7 步 · ${STEP_META[currentStep].title}｜${STEP_META[currentStep].hint}`;
}

function refreshCalculatedUI(calcInput){
  const c = calcInput || calculateModel(state);
  lastCalc = c;
  const view = {
    totalAreaWan: fixed(c.totalAreaWan,2),
    weightedPrice: fixed(c.weightedPrice,2),
    saturatedRevenueWan: wan(c.residentialSaturated + c.commercialSaturated + c.parkingSaturated),
    resSatWan: wan(c.residentialSaturated),
    comSatWan: wan(c.commercialSaturated),
    parkSatWan: wan(c.parkingSaturated),
    propertyRatePct: pct(c.params.propertyCollectionRate),
    parkingRatePct: pct(c.params.parkingCollectionRate),
    resIncomeWan: wan(c.residentialIncome),
    comIncomeWan: wan(c.commercialIncome),
    parkIncomeWan: wan(c.parkingIncome),
    multiIncomeWan: wan(c.multiIncome),
    subsidyIncomeWan: wan(c.subsidyIncome),
    revenueWan: wan(c.revenue),
    revenueWanBig: wan(c.revenue),
    staffCount: fixed(c.staffCount,0),
    staffCostWan: wan(c.staffCost),
    staffCostWanBig: wan(c.staffCost),
    maintenanceCostWan: wan(c.maintenanceCost),
    energyCostWan: wan(c.energyCost),
    depCostWan: wan(c.depreciationCost),
    opsCostWan: wan(c.opsCost),
    opsCostYuan: '¥' + fixed(c.opsCost,0),
    mgmtWan: wan(c.managementFee),
    contingencyWan: wan(c.contingencyCost),
    taxWan: wan(c.taxCost),
    totalCostWan: wan(c.totalCost),
    netWan: signedWan(c.netProfit),
    netMarginPct: pct(c.netMargin),
    beMultiTotalWan: wan(c.beMultiTotal),
    beMultiNewWan: wan(c.beMultiNew),
    targetMultiTotalWan: wan(c.targetMultiTotal),
    bePropertyPct: pct(c.bePropertyRate),
    targetPropertyPct: pct(c.targetPropertyRate)
  };
  $$('[data-calc]').forEach(el => {
    const key = el.dataset.calc;
    if(Object.prototype.hasOwnProperty.call(view,key)) el.textContent = view[key];
  });
  $$('[data-tone="net"]').forEach(el => {
    el.style.color = c.netProfit < 0 ? 'var(--red)' : 'var(--green)';
  });
  const verdictEl = $('[data-calc="verdict"]');
  if(verdictEl){
    const label = c.netProfit < 0 ? '亏损' : c.netProfit > 0 ? '盈利' : '盈亏平衡';
    const cls = c.netProfit < 0 ? 'loss' : c.netProfit > 0 ? 'profit' : 'break';
    verdictEl.textContent = label;
    verdictEl.className = 'verdict ' + cls;
  }

  const rowGroups = {staffRows:c.staffRows, opsRows:c.opsRows, energyRows:c.energyRows, assetRows:c.assetRows};
  $$('[data-row-group]').forEach(el => {
    const group = rowGroups[el.dataset.rowGroup] || [];
    const line = group.find(x => x.id === el.dataset.row);
    if(line) el.textContent = formatByFmt(line[el.dataset.field], el.dataset.fmt);
  });

  if(currentStep === 6 && window.echarts && Object.keys(charts).length){
    updateResultCharts(c);
  }
}

function disposeCharts(){
  Object.values(charts).forEach(chart => { try{chart.dispose();}catch(e){} });
  charts = {};
}
function showStep(index){
  currentStep = Math.max(0, Math.min(STEP_META.length-1, index));
  disposeCharts();
  if(container) container.innerHTML = STEP_TEMPLATES[currentStep]();
  renderStepper();
  updateNav();
  const c = calculateModel(state);
  refreshCalculatedUI(c);
  if(currentStep === 6) initResultCharts(c);
  window.scrollTo(0,0);
}
function navigateManually(index){
  stopAutoplay();
  if(index >= 0 && index < STEP_META.length && index !== currentStep) showStep(index);
  updatePlayButton();
}

function syncLinkedInputs(path, sourceEl){
  let selector;
  try { selector = `[data-bind="${CSS.escape(path)}"]`; } catch(e){ selector = `[data-bind="${path}"]`; }
  $$(selector).forEach(other => {
    if(other === sourceEl) return;
    const v = getPath(state,path);
    if(other.tagName === 'SELECT'){
      other.value = v;
    }else if(v === '' || v === null || v === undefined){
      other.value = '';
    }else if(other.dataset.bindType === 'percent'){
      other.value = num(v) * 100;
    }else if(other.dataset.bindType === 'wanYuan'){
      other.value = num(v) / 10000;
    }else{
      other.value = v;
    }
  });
}
function handleBindEvent(e){
  const el = e.target.closest('[data-bind]');
  if(!el || !container.contains(el)) return;
  const path = el.dataset.bind;
  let value;
  if(el.tagName === 'SELECT'){
    value = el.value;
  }else if(el.type === 'number' || el.type === 'range'){
    if(String(el.value).trim() === ''){
      value = '';
    }else{
      value = parseFloat(el.value);
      if(!Number.isFinite(value)) return;
      if(el.dataset.bindType === 'percent') value = value / 100;
      if(el.dataset.bindType === 'wanYuan') value = value * 10000;
    }
  }else{
    value = el.value;
  }
  setPath(state,path,value);
  syncLinkedInputs(path,el);
  refreshCalculatedUI();
}

function updatePlayButton(){
  if(!playBtn) return;
  const playing = autoplayTimer !== null;
  playBtn.textContent = playing ? '■ 停止演示' : '▶ 自动演示录入';
  playBtn.classList.toggle('playing', playing);
}
function stopAutoplay(){
  if(autoplayTimer !== null){
    clearInterval(autoplayTimer);
    autoplayTimer = null;
  }
  updatePlayButton();
}
function startAutoplay(){
  stopAutoplay();
  showStep(0);
  autoplayTimer = setInterval(() => {
    if(currentStep >= STEP_META.length - 1){
      stopAutoplay();
      return;
    }
    showStep(currentStep + 1);
    if(currentStep === STEP_META.length - 1){
      stopAutoplay();
    }
  }, 3200);
  updatePlayButton();
}

function gaugeOption(title, valueWan, color){
  const max = Math.ceil(Math.max(240, num(valueWan) * 1.25) / 10) * 10;
  return {
    animation:false,
    series:[{
      type:'gauge', min:0, max, radius:'94%', center:['50%','58%'],
      progress:{show:true,width:14,itemStyle:{color}},
      axisLine:{lineStyle:{width:14,color:[[1,'rgba(148,184,220,.18)']]}},
      axisTick:{show:false},
      splitLine:{length:10,lineStyle:{color:'rgba(220,236,255,.38)'}},
      axisLabel:{color:'#9db4cc',distance:18,fontSize:10},
      pointer:{width:5,itemStyle:{color}},
      anchor:{show:true,size:14,itemStyle:{color}},
      detail:{valueAnimation:false,formatter:v => fixed(v,2)+' 万',color:'#fff',fontSize:23,fontWeight:800,offsetCenter:[0,'39%']},
      title:{color:'#9db4cc',fontSize:13,offsetCenter:[0,'69%']},
      data:[{value:num(valueWan),name:title}]
    }]
  };
}
function revenueBarOption(c){
  return {
    animation:false,
    tooltip:{trigger:'axis',valueFormatter:v => fixed(v,2)+' 万元'},
    grid:{left:48,right:18,top:34,bottom:34},
    xAxis:{type:'category',data:['住宅','商业','车位','多经','补贴'],axisLine:{lineStyle:{color:'rgba(157,196,232,.3)'}},axisLabel:{color:'#bcd3ea'}},
    yAxis:{type:'value',name:'万元',nameTextStyle:{color:'#9db4cc'},axisLabel:{color:'#9db4cc'},splitLine:{lineStyle:{color:'rgba(157,196,232,.12)'}}},
    series:[{
      type:'bar',barWidth:'48%',
      data:[c.residentialIncome/1e4,c.commercialIncome/1e4,c.parkingIncome/1e4,c.multiIncome/1e4,c.subsidyIncome/1e4],
      itemStyle:{color:new window.echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#7ce7ff'},{offset:1,color:'#2377ff'}]),borderRadius:[8,8,0,0]},
      label:{show:true,position:'top',color:'#dcecff',formatter:p => fixed(p.value,2)}
    }]
  };
}
function costDonutOption(c){
  const data = [
    {name:'人员费用',value:c.staffCost/1e4,itemStyle:{color:'#39d5ff'}},
    {name:'项目运营费',value:c.opsCost/1e4,itemStyle:{color:'#2f7fff'}},
    {name:'公共能耗',value:c.energyCost/1e4,itemStyle:{color:'#35d39a'}},
    {name:'物资折旧',value:c.depreciationCost/1e4,itemStyle:{color:'#7dd3fc'}},
    {name:'管理酬金',value:c.managementFee/1e4,itemStyle:{color:'#ffd166'}},
    {name:'不可预见费',value:c.contingencyCost/1e4,itemStyle:{color:'#ffb454'}},
    {name:'综合税费',value:c.taxCost/1e4,itemStyle:{color:'#ff6b6b'}}
  ];
  return {
    animation:false,
    tooltip:{trigger:'item',formatter:p => `${p.name}<br/>${fixed(p.value,2)} 万元（${p.percent}%）`},
    legend:{bottom:0,type:'scroll',textStyle:{color:'#bcd3ea',fontSize:11}},
    series:[{
      type:'pie',radius:['45%','70%'],center:['50%','45%'],avoidLabelOverlap:true,
      label:{show:false},labelLine:{show:false},data
    }]
  };
}
function curveOption(c){
  const netData = [];
  const marginData = [];
  for(let r=0;r<=100;r++){
    const cc = calculateModel(state,{params:{propertyCollectionRate:r/100}});
    netData.push([r, Number((cc.netProfit/1e4).toFixed(4))]);
    marginData.push([r, Number((cc.netMargin*100).toFixed(4))]);
  }
  const currentRate = num(c.params.propertyCollectionRate) * 100;
  const beRate = num(c.bePropertyRate) * 100;
  const markData = [{xAxis:currentRate,label:{show:false},lineStyle:{color:'#39d5ff',type:'solid',width:2}}];
  if(beRate <= 100) markData.push({xAxis:beRate,label:{show:false},lineStyle:{color:'#ffb454',type:'dashed',width:2}});
  return {
    animation:false,
    tooltip:{trigger:'axis',formatter(params){
      const r = Math.round(num(params?.[0]?.data?.[0]));
      const cc = calculateModel(state,{params:{propertyCollectionRate:r/100}});
      return `物业费收缴率 ${r}%<br/>实收收入：${wan(cc.revenue)} 万元<br/>净利润：${signedWan(cc.netProfit)} 万元<br/>净利率：${pct(cc.netMargin)}`;
    }},
    legend:{top:0,textStyle:{color:'#bcd3ea'},data:['净利润（万元）','净利率（%）']},
    grid:{left:54,right:54,top:42,bottom:38},
    xAxis:{type:'value',min:0,max:100,name:'收缴率',nameTextStyle:{color:'#9db4cc'},axisLabel:{color:'#9db4cc',formatter:'{value}%'},splitLine:{lineStyle:{color:'rgba(157,196,232,.1)'}}},
    yAxis:[
      {type:'value',name:'净利润(万元)',nameTextStyle:{color:'#9db4cc'},axisLabel:{color:'#9db4cc'},splitLine:{lineStyle:{color:'rgba(157,196,232,.12)'}}},
      {type:'value',name:'净利率(%)',nameTextStyle:{color:'#9db4cc'},axisLabel:{color:'#9db4cc',formatter:'{value}%'},splitLine:{show:false}}
    ],
    series:[
      {name:'净利润（万元）',type:'line',smooth:true,showSymbol:false,data:netData,lineStyle:{width:3,color:'#39d5ff'},itemStyle:{color:'#39d5ff'},markLine:{symbol:'none',data:markData}},
      {name:'净利率（%）',type:'line',yAxisIndex:1,smooth:true,showSymbol:false,data:marginData,lineStyle:{width:2,color:'#ffb454'},itemStyle:{color:'#ffb454'}}
    ]
  };
}
function initResultCharts(c){
  if(!window.echarts){
    ['gaugeRevenue','gaugeCost','chartRevenue','chartCost','chartCurve'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.innerHTML = '<div class="chart-error">未加载本地 ECharts。<br/>请确认 echarts.min.js 与本 HTML 位于同一文件夹后刷新。</div>';
    });
    return;
  }
  ['gaugeRevenue','gaugeCost','chartRevenue','chartCost','chartCurve'].forEach(id => {
    const el = document.getElementById(id);
    if(el) charts[id] = echarts.init(el);
  });
  updateResultCharts(c);
}
function updateResultCharts(c){
  if(!window.echarts || !Object.keys(charts).length) return;
  if(charts.gaugeRevenue) charts.gaugeRevenue.setOption(gaugeOption('年收入（万元）',c.revenue/1e4,'#39d5ff'),true);
  if(charts.gaugeCost) charts.gaugeCost.setOption(gaugeOption('年成本（万元）',c.totalCost/1e4,'#ffb454'),true);
  if(charts.chartRevenue) charts.chartRevenue.setOption(revenueBarOption(c),true);
  if(charts.chartCost) charts.chartCost.setOption(costDonutOption(c),true);
  if(charts.chartCurve) charts.chartCurve.setOption(curveOption(c),true);
}

if(stepper) stepper.addEventListener('click', e => {
  const btn = e.target.closest('[data-step]');
  if(btn) navigateManually(Number(btn.dataset.step));
});
if(prevBtn) prevBtn.addEventListener('click', () => navigateManually(currentStep - 1));
if(nextBtn) nextBtn.addEventListener('click', () => navigateManually(currentStep === 6 ? 0 : currentStep + 1));
if(container){
  container.addEventListener('input', handleBindEvent);
  container.addEventListener('change', handleBindEvent);
}
if(playBtn) playBtn.addEventListener('click', () => {
  if(autoplayTimer !== null) stopAutoplay(); else startAutoplay();
});
const clearBtn = document.getElementById('clearBtn');
const resetBtn = document.getElementById('resetBtn');
if(clearBtn) clearBtn.addEventListener('click', () => {
  if(window.confirm('确定清空当前填写内容？可点击“恢复云栖样例”找回基准数据。')){
    state = createEmptyState();
    showStep(currentStep);
  }
});
if(resetBtn) resetBtn.addEventListener('click', () => {
  state = clone(DEFAULT_STATE);
  showStep(currentStep);
});
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => Object.values(charts).forEach(chart => { try{chart.resize();}catch(e){} }), 160);
});

rootObject.YQApp = {
  showStep, startAutoplay, stopAutoplay,
  getState: () => state,
  getLastCalc: () => lastCalc
};

if(container && stepper && document.getElementById('stepContainer')){
  renderStepper();
  showStep(0);
  if(prevBtn) prevBtn.disabled = true;
  updatePlayButton();
}

  </script>
</body>
</html>
